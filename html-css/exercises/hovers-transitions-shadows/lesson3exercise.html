<style>
  .uber {
    background-color: black;
    color: white;
    height: 36px;
    width: 130px;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .uber:hover {
    opacity: 0.8;
  }

  .uber:active {
    opacity: 0.5;
  }

  .amazon {
    background-color: rgb(255, 216, 20);
    color: black;
    border: none;
    height: 36px;
    width: 150px;
    border-radius: 18px;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s; 
  }

  .amazon:hover {
    background-color: black;
    color: rgb(255, 216, 20);
  }

  .amazon:active {
    opacity: 0.7;
  }

  .github {
    background-color: rgb(46, 164, 79);
    color: white;
    height: 40px;
    width: 80px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: box-shadow 0.15s;
  }

  .github:hover {
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
  }

  .github:active {
    opacity: 0.7;
  }

  .bootstrap {
    background-color: rgb(121, 82, 179);
    color: white;
    height: 40px;
    width: 105px;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }

  .bootstrap:hover {
    background-color: white;
    color: rgb(121, 82, 179);
  }

  .bootstrap:active {
    opacity: 0.7;
  }

  .bootstrap-2 {
    background-color: white;
    color: rgb(108, 117, 125);
    height: 40px;
    width: 105px;
    border-radius: 4px;
    border-width: 1px;
    font-weight: bold;
    color: #000;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }

  .bootstrap-2:hover {
    background-color: rgb(108, 117, 125);
    color: white;
  }

  .bootstrap-2:active {
    opacity: 0.7;
  }

  .linkedin {
    background-color: rgb(10, 102, 194);
    color: white;
    height: 40px;
    width: 210px;
    border: none;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }

  .linkedin:hover {
    background-color: white;
    color: rgb(10, 102, 194);
  }

  .linkedin:active {
    opacity: 0.7;
  }

  .linkedin-2 {
    background-color: white;
    color: rgb(10, 102, 194);
    height: 40px;
    width: 70px;
    border-width: 1px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
  }

  .linkedin-2:hover {
    background-color: rgb(79, 132, 185);
    border-width: 2px;
    border-color: rgb(10, 102, 194);
  }

</style>


<button class="uber">
  Request now
</button>

</button>

</button>

</button>
