<!DOCTYPE html>
<html lang="en">
<head>
  <title>Challenge Exercise 12f</title>

  <style>
    .header {
      background-color: blueviolet;
      padding: 20px 15px 20px 15px;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }

    .right {
      color: white;
      font-weight: bold;
    }

    .middle {
      border-radius: 20px;
      flex: 1;
      max-width: 500px;
    }

    .in-put {
      padding: 4px 20px;
      width: 300px;
      border: none;
      border-radius: 16px;
    }

    button {
      background-color: blueviolet;
      color: white;
      font-weight: bold;
      padding: 8px 16px;
      border-color: white;
    }

    .left {
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="right">
      Home
    </div>

    <div class="middle">
      <input class="in-put" type="text" placeholder="Search">
    </div>
    
    <div class="left">
      <button>Download</button>
    </div>
  </div>
</body>
</html>
