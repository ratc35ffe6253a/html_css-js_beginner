<!DOCTYPE html>
<html lang="en">
<head>

    .outer {
      display: flex;
      flex: row;
      justify-content: space-between;
      border-radius: 10px;
      border-color: black;
      width: 300px;
    }
    
    .right-part {
      margin-right: 30px;

    }

    div {

      color: white;
      padding: 4px 16px;

      border-radius: 16px;

      display: block;
      margin-bottom: 10px;
      align-items: center;
      vertical-align: top;
    }
  </style>
</head>
<body>
  <div class="outer">
    <div class="right-part">
      <div class="home">Home</div>
      <div>Notifications</div>

    <div class="left-part">
      <button>14</button>

</html>
